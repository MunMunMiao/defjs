name: Release

on:
  push:
    tags:
      - 'release-core-v*'
      - 'release-opentelemetry-server-v*'
      - 'release-react-v*'
      - 'release-vue-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - name: Resolve release target
        id: target
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/release-target.ts "$RELEASE_TAG"
      - name: Build selected package
        working-directory: ${{ steps.target.outputs.package_dir }}
        run: bun --bun run build
      - name: Publish selected package
        working-directory: ${{ steps.target.outputs.package_dir }}/dist
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --access public
