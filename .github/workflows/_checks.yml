name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-deps
      - name: Check release plan
        shell: bash
        run: |
          pnpm changeset status --output "$RUNNER_TEMP/changeset-status.json"
          jq -e '
            [
              .releases[]
              | select(
                  .name == "@defjs/core"
                  or .name == "@defjs/opentelemetry-server"
                  or .name == "@defjs/react"
                  or .name == "@defjs/vue"
                )
            ] as $releases
            | ($releases | length == 4)
              and ($releases | all(.type == "minor"))
              and ([$releases[].name] | unique | length == 4)
              and ([.releases[] | select(.type != "none")] | length == 4)
          ' "$RUNNER_TEMP/changeset-status.json"
      - name: Check lockfile health
        run: pnpm dedupe --check
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm fmt:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-deps
      - name: Get Playwright version
        id: playwright-version
        shell: bash
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Test
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-deps
      - name: Build
        run: pnpm build
      - name: Pack packages
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/packed-packages"
          pnpm --dir packages/core pack --pack-destination "$RUNNER_TEMP/packed-packages"
          pnpm --dir packages/opentelemetry-server pack --pack-destination "$RUNNER_TEMP/packed-packages"
          pnpm --dir packages/react pack --pack-destination "$RUNNER_TEMP/packed-packages"
          pnpm --dir packages/vue pack --pack-destination "$RUNNER_TEMP/packed-packages"
      - name: Upload packed packages
        uses: actions/upload-artifact@v4
        with:
          name: packed-packages
          path: ${{ runner.temp }}/packed-packages/*.tgz
          if-no-files-found: error
          retention-days: 1

  packed-consumer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Download packed packages
        uses: actions/download-artifact@v4
        with:
          name: packed-packages
          path: ${{ runner.temp }}/packed-packages
      - name: Verify packed consumer
        run: node scripts/verify-packed-consumer.mjs "$RUNNER_TEMP/packed-packages"
