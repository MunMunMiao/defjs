packages:
  - 'packages/*'
  - 'examples'
  - 'examples/*'
  - 'doc'

allowBuilds:
  esbuild: true

peerDependencyRules:
  allowedVersions:
    '@hono/node-ws>@hono/node-server': '^2.0.0'

catalog:
  '@changesets/changelog-github': '^0.7.0'
  '@changesets/cli': '^2.31.1'
  '@hono/node-server': '^2.0.11'
  '@hono/node-ws': '^1.3.1'
  '@types/node': '^26.1.1'
  '@vitest/browser': '^4.1.10'
  '@vitest/browser-playwright': '^4.1.10'
  '@vitest/coverage-istanbul': '^4.1.10'
  hono: '^4.12.32'
  oxfmt: '0.60.0'
  oxlint: '1.75.0'
  oxlint-tsgolint: '7.0.2001'
  playwright: '^1.62.0'
  tsdown: '^0.22.14'
  tsx: '^4.23.1'
  typescript: '^7.0.2'
  vite: '^8.1.5'
  vitest: '^4.1.10'

